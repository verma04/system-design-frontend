version: "3.8"

services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: always
    command:
      - "--api.insecure=true" # Traefik Dashboard (optional)
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=pankaj.verma@pulseplaydigital.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik dashboard (optional)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"

  thrico-web:
    container_name: thrico-web
    build:
      context: .
      dockerfile: ./docker/prod/Dockerfile-web
    ports:
      - "4000:4000" # Exposing port 4000 internally to 80 externally
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`*.thrico.app`)"
      - "traefik.http.services.app.loadbalancer.server.port=80" # The port your app is listening on
      - "traefik.http.routers.app.tls.certresolver=myresolver"
    networks:
      - webnet

  # Other services (e.g., login, backend) can be added similarly

networks:
  webnet:
    driver: bridge
